<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Play</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>study <span class="logo-light">play</span></h1>
        </div>
    </header>

    <nav class="subject-nav">
        <div class="subject-nav-scroll">
            <a href="#" class="subject-item active">All</a>
            <a href="#" class="subject-item">Hindi</a>
            <a href="#" class="subject-item">English</a>
            <a href="#" class="subject-item">Math</a>
            <a href="#" class="subject-item">Social Science</a>
            <a href="#" class="subject-item">Science</a>
            <a href="#" class="subject-item">Sanskrit</a>
            <a href="#" class="subject-item">History</a>
            <a href="#" class="subject-item">More</a>
        </div>
        <button class="filter-btn">
            <span class="material-icons">filter_list</span>
        </button>
    </nav>

    <main class="video-feed">
        <!-- Placeholder for video cards -->
        <div class="video-card">
            <div class="thumbnail-placeholder"></div>
            <div class="video-details">
                <h3 class="video-title">Video Title Placeholder</h3>
                <div class="video-meta">
                    <span>1M views</span>
                    <span>&bull;</span>
                    <span>100K likes</span>
                    <span>&bull;</span>
                    <span>2 weeks ago</span>
                </div>
            </div>
        </div>
         <div class="video-card">
            <div class="thumbnail-placeholder"></div>
            <div class="video-details">
                <h3 class="video-title">Another Video Title Placeholder</h3>
                <div class="video-meta">
                    <span>500K views</span>
                    <span>&bull;</span>
                    <span>50K likes</span>
                    <span>&bull;</span>
                    <span>1 month ago</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="bottom-nav">
        <a href="#" class="bottom-nav-item active">
            <span class="material-icons">home</span>
            <span class="nav-text">Home</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <span class="material-icons">search</span>
            <span class="nav-text">Search</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <span class="material-icons">settings</span>
            <span class="nav-text">Settings</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <span class="material-icons">person</span>
            <span class="nav-text">Profile</span>
        </a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
