<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Profile - Study Play</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="public-profile-page">

    <div class="form-container">
        <div class="form-toggle">
            <button id="show-login-btn" class="toggle-btn active">Login</button>
            <button id="show-register-btn" class="toggle-btn">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <h2>Login to Public Profile</h2>
            <div class="input-group">
                <label for="login-email">Email ID</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" style="display: none;">
            <h2>Create Public Profile</h2>
            <div class="input-group">
                <label for="register-name">Name</label>
                <input type="text" id="register-name" required>
            </div>
            <div class="input-group">
                <label for="register-class">Class (1-12)</label>
                <input type="number" id="register-class" min="1" max="12" required>
            </div>
            <div class="input-group">
                <label for="register-email">Email ID</label>
                <input type="email" id="register-email" required>
            </div>
            <div class="input-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" required>
            </div>
            <div class="input-group">
                <label for="register-re-password">Re-enter Password</label>
                <input type="password" id="register-re-password" required>
            </div>
            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
